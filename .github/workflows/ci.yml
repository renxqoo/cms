name: CI

on: [push, pull_request]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CMS_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/cms_test
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cms_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d cms_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Configure PostgreSQL migration lock capacity
        env:
          CMS_POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          docker exec "$CMS_POSTGRES_CONTAINER" psql -U postgres -d cms_test -v ON_ERROR_STOP=1 -c 'ALTER SYSTEM SET max_locks_per_transaction = 1024' -c "ALTER SYSTEM SET max_wal_size = '4GB'" -c "ALTER SYSTEM SET checkpoint_timeout = '30min'"
          docker restart "$CMS_POSTGRES_CONTAINER"
          for attempt in $(seq 1 60); do
            if docker exec "$CMS_POSTGRES_CONTAINER" pg_isready -U postgres -d cms_test; then
              break
            fi
            sleep 1
          done
          test "$(docker exec "$CMS_POSTGRES_CONTAINER" psql -U postgres -d cms_test -At -v ON_ERROR_STOP=1 -c 'SHOW max_locks_per_transaction')" = '1024'
          test "$(docker exec "$CMS_POSTGRES_CONTAINER" psql -U postgres -d cms_test -At -v ON_ERROR_STOP=1 -c 'SHOW max_wal_size')" = '4GB'
          test "$(docker exec "$CMS_POSTGRES_CONTAINER" psql -U postgres -d cms_test -At -v ON_ERROR_STOP=1 -c 'SHOW checkpoint_timeout')" = '30min'
          test "$(docker exec "$CMS_POSTGRES_CONTAINER" psql -U postgres -d cms_test -At -v ON_ERROR_STOP=1 -c 'SHOW fsync')" = 'on'
          test "$(docker exec "$CMS_POSTGRES_CONTAINER" psql -U postgres -d cms_test -At -v ON_ERROR_STOP=1 -c 'SHOW full_page_writes')" = 'on'
          test "$(docker exec "$CMS_POSTGRES_CONTAINER" psql -U postgres -d cms_test -At -v ON_ERROR_STOP=1 -c 'SHOW synchronous_commit')" = 'on'
      - name: Check out source with checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up Bun 1.4.4 with setup-bun v2.2.0
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.4.4'
      - name: Set up Node 26.9.0 with setup-node v7.1.0
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '26.9.0'
          package-manager-cache: false
      - name: Verify runtimes
        run: |
          test "$(bun --version)" = '1.4.4'
          test "$(node --version)" = 'v26.9.0'
          printf 'CMS_NODE_BINARY=%s\n' "$(node -p 'process.execPath')" >> "$GITHUB_ENV"
      - name: Install dependencies
        env:
          HUSKY: '0'
        run: bun install --frozen-lockfile
      - name: Install browser runtime
        run: bun --bun node_modules/@playwright/test/cli.js install --with-deps chromium
      - name: Lint
        run: bun run lint
      - name: Typecheck
        run: bun run typecheck
      - name: Build
        run: bun run build
      - name: Test with coverage and Bun and Node network journeys
        run: bun run test
