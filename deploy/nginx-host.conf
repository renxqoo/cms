server {
    listen 443 ssl;
    server_name __SERVER_NAME__;
    ssl_certificate /etc/new-cms/tls/fullchain.pem;
    ssl_certificate_key /etc/new-cms/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 256k;

    location / {
        proxy_pass http://127.0.0.1:__PORT__;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Forwarded-Host "";
        proxy_set_header X-OneAster-Client-IP $remote_addr;
        proxy_set_header X-OneAster-Service-Token "";
        proxy_set_header X-OneAster-Login-Proxy-Token "";
        proxy_read_timeout 45s;
        proxy_send_timeout 45s;
        proxy_buffering off;
    }
}
