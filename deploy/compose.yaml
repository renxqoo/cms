services:
  client:
    image: ${ADMIN_IMAGE:-new-cms:local}
    build:
      context: ..
    env_file:
      - ../.env
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: 9090
    expose:
      - '9090'
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - client-private
      - backend
  edge:
    image: nginx:1.30.6-alpine
    ports:
      - '443:443'
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/tls:ro
    depends_on:
      client:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - client-private
networks:
  client-private:
    internal: true
  backend:
    external: true
    name: oneaster-backend
