services:
  cms:
    image: ${CMS_IMAGE:?CMS_IMAGE must identify a verified local image}
    pull_policy: never
    network_mode: host
    init: true
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    stop_grace_period: 45s
    mem_limit: 2g
    cpus: 2.0
    pids_limit: 256
    env_file:
      - /etc/new-cms/docker.env
    volumes:
      - /var/lib/new-cms/assets:/var/lib/new-cms/assets
      - /etc/ssl/certs:/etc/ssl/certs:ro
    tmpfs:
      - /tmp:size=128m,mode=1777
      - /app/apps/admin/.next/cache:size=128m,uid=1000,gid=1000,mode=0750
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
